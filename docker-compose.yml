version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cashdesk-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       cashdesk
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: cashdesk_dev_password
    ports:
      - "5432:5432"
    volumes:
      - cashdesk_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  cashdesk_pg_data:
